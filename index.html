<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>樊登讲书 | 时间游戏</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap');

:root {
  --primary: #F59E0B;
  --primary-dark: #D97706;
  --primary-darker: #B45309;
  --bg-deep: #0A0A0A;
  --bg-card: #141414;
  --bg-surface: #1A1A1A;
  --bg-elevated: #262626;
  --text-primary: #FAFAF9;
  --text-secondary: #D6D3D1;
  --text-muted: #A8A29E;
  --border-subtle: rgba(245,158,11,0.12);
  --border-active: rgba(245,158,11,0.4);
  --glow: rgba(245,158,11,0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background atmosphere */
body::before {
  content: '';
  position: fixed;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(ellipse at 30% 20%, rgba(245,158,11,0.04) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(217,119,6,0.03) 0%, transparent 50%);
  animation: bgDrift 30s ease-in-out infinite alternate;
  pointer-events: none;
  z-index: 0;
}

@keyframes bgDrift {
  0% { transform: translate(0, 0) rotate(0deg); }
  100% { transform: translate(-3%, -3%) rotate(2deg); }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary-darker); }

/* Chapter nav */
.chapter-nav {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding: 4px 0;
  scrollbar-width: none;
}
.chapter-nav::-webkit-scrollbar { display: none; }

.chapter-btn {
  flex-shrink: 0;
  padding: 8px 16px;
  border: 1px solid transparent;
  border-radius: 20px;
  background: var(--bg-surface);
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  white-space: nowrap;
}
.chapter-btn:hover {
  background: var(--bg-elevated);
  color: var(--text-secondary);
  border-color: var(--border-subtle);
}
.chapter-btn.active {
  background: rgba(245,158,11,0.12);
  color: var(--primary);
  border-color: var(--border-active);
  box-shadow: 0 0 20px var(--glow);
}

/* Player controls */
.play-btn {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border: none;
  color: var(--bg-deep);
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  box-shadow: 0 4px 24px rgba(245,158,11,0.3);
}
.play-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 6px 32px rgba(245,158,11,0.45);
}
.play-btn:active { transform: scale(0.96); }

.ctrl-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}
.ctrl-btn:hover {
  background: rgba(245,158,11,0.1);
  color: var(--primary);
  border-color: var(--border-active);
}

/* Progress bar */
.progress-track {
  width: 100%;
  height: 6px;
  background: var(--bg-elevated);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-dark), var(--primary));
  border-radius: 3px;
  transition: width 0.3s ease;
  box-shadow: 0 0 8px rgba(245,158,11,0.3);
}

/* Speed buttons */
.speed-btn {
  padding: 4px 10px;
  border-radius: 12px;
  background: transparent;
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}
.speed-btn:hover { border-color: var(--text-muted); color: var(--text-secondary); }
.speed-btn.active {
  background: rgba(245,158,11,0.12);
  border-color: var(--border-active);
  color: var(--primary);
}

/* Text cards */
.speech-card {
  padding: 20px 24px;
  border-radius: 12px;
  border-left: 3px solid transparent;
  background: var(--bg-card);
  transition: all 0.5s ease;
  opacity: 0.5;
}
.speech-card.active {
  opacity: 1;
  border-left-color: var(--primary);
  background: rgba(245,158,11,0.04);
  box-shadow: 0 2px 20px rgba(245,158,11,0.06);
}
.speech-card.played { opacity: 0.7; }
.speech-card p {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  line-height: 1.9;
  color: var(--text-secondary);
  letter-spacing: 0.02em;
}
.speech-card.active p { color: var(--text-primary); }

/* Quote highlight */
.quote-line {
  display: block;
  font-weight: 600;
  color: var(--primary) !important;
  font-size: 17px !important;
}

/* Pulse animation for active card */
@keyframes subtlePulse {
  0%, 100% { box-shadow: 0 2px 20px rgba(245,158,11,0.06); }
  50% { box-shadow: 0 2px 30px rgba(245,158,11,0.12); }
}
.speech-card.active.is-speaking { animation: subtlePulse 2s ease-in-out infinite; }

/* Voice selector */
.voice-select {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  outline: none;
  cursor: pointer;
}
.voice-select:focus { border-color: var(--border-active); }

/* Status indicator */
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: background 0.3s ease;
}
.status-dot.speaking { background: #22C55E; animation: dotPulse 1.5s infinite; }
.status-dot.paused { background: var(--primary); }

@keyframes dotPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Mobile adjustments */
@media (max-width: 768px) {
  .play-btn { width: 56px; height: 56px; font-size: 20px; }
  .speech-card { padding: 16px 18px; }
  .speech-card p { font-size: 15px; line-height: 1.8; }
  .chapter-btn { padding: 6px 12px; font-size: 12px; }
}

/* Smooth scroll behavior */
.scroll-container {
  scroll-behavior: smooth;
  scroll-padding-top: 20px;
}

/* Initial loading */
.loading-overlay {
  position: fixed; inset: 0;
  background: var(--bg-deep);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: opacity 0.5s ease;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }

.loader {
  width: 48px; height: 48px;
  border: 3px solid var(--bg-elevated);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Unsupported browser warning */
.warning-banner {
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}
</style>
</head>
<body>
<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loader"></div>
  <p style="margin-top:16px; color:var(--text-muted); font-size:14px;">正在初始化播客引擎...</p>
</div>

<div style="position:relative; z-index:1; max-width:860px; margin:0 auto; padding:20px 20px 80px;">

  <!-- Header -->
  <header style="text-align:center; padding:40px 0 32px;">
    <div style="display:inline-flex; align-items:center; gap:10px; margin-bottom:16px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </div>
    <h1 style="font-family:'Noto Serif SC',serif; font-size:28px; font-weight:600; letter-spacing:0.04em;">樊登讲书</h1>
    <h2 style="font-family:'Noto Serif SC',serif; font-size:22px; font-weight:600; color:var(--primary); margin-top:8px;">时间游戏</h2>
    <p style="color:var(--text-muted); font-size:14px; margin-top:12px; letter-spacing:0.06em;">时间是身边风险和远方机会的组合</p>
    <div style="display:flex; align-items:center; justify-content:center; gap:16px; margin-top:16px; color:var(--text-muted); font-size:13px;">
      <span>📖 周洛华 著</span>
      <span style="opacity:0.3;">|</span>
      <span>🎙️ 樊登风格播讲</span>
      <span style="opacity:0.3;">|</span>
      <span id="totalDuration">⏱ 约35分钟</span>
    </div>
  </header>

  <!-- Unsupported warning -->
  <div class="warning-banner" id="warningBanner" style="display:none; margin-bottom:20px;">
    <p style="color:#EF4444; font-size:14px;">⚠️ 您的浏览器不支持语音合成功能，请使用 Chrome、Safari 或 Edge 浏览器。</p>
  </div>

  <!-- Player Controls -->
  <div style="background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:16px; padding:24px; margin-bottom:24px;">
    <!-- Status & Progress -->
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:16px;">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText" style="font-size:12px; color:var(--text-muted);">准备就绪</span>
      <span style="flex:1;"></span>
      <span id="currentSegmentInfo" style="font-size:12px; color:var(--text-muted);">0 / 0</span>
    </div>

    <!-- Progress -->
    <div class="progress-track" id="progressTrack" onclick="seekToProgress(event)">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:6px;">
      <span id="elapsedTime" style="font-size:11px; color:var(--text-muted); font-variant-numeric:tabular-nums;">00:00</span>
      <span id="estimatedTotal" style="font-size:11px; color:var(--text-muted); font-variant-numeric:tabular-nums;">--:--</span>
    </div>

    <!-- Controls -->
    <div style="display:flex; align-items:center; justify-content:center; gap:20px; margin-top:20px;">
      <button class="ctrl-btn" onclick="prevSegment()" title="上一段">⏮</button>
      <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" onclick="nextSegment()" title="下一段">⏭</button>
      <button class="ctrl-btn" onclick="stopPlay()" title="停止">⏹</button>
    </div>

    <!-- Speed & Voice -->
    <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin-top:16px; flex-wrap:wrap;">
      <span style="font-size:11px; color:var(--text-muted); margin-right:4px;">语速</span>
      <button class="speed-btn" data-speed="0.8" onclick="setSpeed(0.8)">0.8x</button>
      <button class="speed-btn" data-speed="0.9" onclick="setSpeed(0.9)">0.9x</button>
      <button class="speed-btn active" data-speed="1.0" onclick="setSpeed(1.0)">1.0x</button>
      <button class="speed-btn" data-speed="1.1" onclick="setSpeed(1.1)">1.1x</button>
      <button class="speed-btn" data-speed="1.2" onclick="setSpeed(1.2)">1.2x</button>
      <span style="opacity:0.3; margin:0 4px;">|</span>
      <select class="voice-select" id="voiceSelect" onchange="changeVoice()">
        <option value="">加载语音中...</option>
      </select>
    </div>
  </div>

  <!-- Chapter Navigation -->
  <div class="chapter-nav" id="chapterNav" style="margin-bottom:24px;"></div>

  <!-- Script Text Area -->
  <div class="scroll-container" id="textContainer" style="display:flex; flex-direction:column; gap:12px; max-height:60vh; overflow-y:auto; padding-right:4px;">
  </div>

  <!-- Footer -->
  <footer style="text-align:center; padding:40px 0 20px; border-top:1px solid var(--border-subtle); margin-top:40px;">
    <p style="color:var(--text-muted); font-size:12px; line-height:1.8;">
      本播客基于樊登讲书风格制作，由 AI 语音合成播报<br>
      《时间游戏》 周洛华 著 · 上海财经大学出版社
    </p>
  </footer>
</div>

<script>
// ========== PODCAST DATA ==========
const PODCAST_DATA = [
  {
    chapter: 1,
    title: "开场",
    paragraphs: [
      "各位好，欢迎收听今天的一期节目。",
      "今天我要给大家讲的这本书，说实话，读完以后我坐了很久。不是因为它不好懂，恰恰是因为它太有冲击力了。它不是那种读完拍大腿说有道理的书，它是那种读完拍大腿说我怎么没想到的书。",
      "这本书叫作《时间游戏》。副标题特别精彩——时间是身边风险和远方机会的组合。",
      "作者叫周洛华，上海财经大学的金融学副教授，达特茅斯学院塔克商学院的金融学博士后。这个人很有意思——他自己在序言里就说了一句话，让我印象特别深。他说什么呢？他说，我这本书不能帮助你提高投资回报率。",
      "你看，一个金融学教授，写了一本关于时间的书，第一个声明就是这本书不能帮你赚钱。他甚至主动披露自己炒股亏了很多钱，卖房炒股，融资炒股，炒股套牢，套牢割肉，割肉创业——他说他每一条弯路都走过一遍。",
      "说实话，我特别喜欢这种坦诚的作者。一个人如果在序言里就告诉你这本书不能帮你赚钱，那他接下来要说的话，反而更值得你认真听。为什么呢？因为他不需要讨好你。",
      "好，我们进入正题。"
    ]
  },
  {
    chapter: 2,
    title: "这本书到底在说什么？",
    paragraphs: [
      "周洛华在这本书里提出了一个全新的时间观。",
      "你想想，我们平时怎么理解时间？墙上挂的钟，手机上的表，滴答滴答，一秒一秒地过。物理学家说时间是宇宙的基本维度，对吧？爱因斯坦说时间跟空间是一回事，叫时空。金融学家说时间是对资产定价的一个参数，时间越长，折现率越高，资产现在的价值就越低。",
      "但是周洛华说——全错了。",
      "他认为，理解时间不应该用物理学和数学的眼光，而应该用人类学和进化论的眼光。他给出的核心定义是：",
      "【时间是身边风险和远方机会的组合。】",
      "这个定义，太妙了。",
      "你想想看——如果你明天就要还房贷，下个月孩子要交学费，信用卡账单月底到期。这个时候，你感受到的时间是什么？是焦虑、紧张、恐惧。你的时间主要是由身边的风险构成的。每一天、每一分钟，你都在想怎么活下去、怎么把钱凑齐。",
      "反过来，如果你手头宽裕，没有紧迫的账单，刚刚升职加薪，对未来的职业发展充满期待。这个时候，你感受到的时间是什么？是希望、期待、跃跃欲试。你的时间主要是由远方的机会构成的。",
      "你看，同一天二十四小时，对于穷人和富人来说，是完全不同的时间。",
      "这就是这本书最核心的洞察。时间不是客观的物理量，时间是一个人对自己处境的主观感受。而一个人对自己处境的感受，取决于他身边有多少迫在眉睫的风险，和远方还有多少值得期待的机会。",
      "你想想，这个视角是不是特别颠覆？"
    ]
  },
  {
    chapter: 3,
    title: "命运女神与灭霸",
    paragraphs: [
      "好，我们继续往下讲。",
      "周洛华用了一个特别生动的类比来解释时间。他说时间在两个极端之间摆动。注意，他用的是摆动这个词，不是波动。这两个词的区别很重要。波动是被动的，你只能接受；摆动是你有所作为的，你可以主动改变。",
      "一端是什么呢？是希腊神话中的命运女神克洛索。她手里拿着纺锤，不断给你时间，给你机会，不求回报。金融学里有个概念叫Martingale世界，说的就是这种永不清盘的赌场：你输了，有人无息借钱给你继续赌；总有一把你能翻本。在命运女神的世界里，时间是无尽的馈赠。",
      "另一端呢？是《复仇者联盟》里的灭霸。打一个响指，随机消灭一半人口。在他面前，时间是生存概率，是纯粹的随机筛选。你今天还活着，不是因为你有能力、你努力，纯粹是因为运气好。",
      "周洛华说，真实的世界介于这两者之间。我们既没有命运女神那么幸运——不会总有人无息借钱给我们；也没有灭霸那么残酷——我们的命运不是完全随机的。",

      "他说，人类社会就是通过形形色色的集体游戏来管理时间的：既获得更多的机会，又降低生存的风险。什么是集体游戏？婚姻是集体游戏，企业是集体游戏，国家是集体游戏，甚至货币本身也是一种集体游戏。人类发明了各种各样的游戏规则，目的只有一个：让自己离命运女神近一点，离灭霸远一点。",
      "这个框架，你先记着。后面讲人上人和天外天的时候，你会发现它是理解全书的关键。"
    ]
  },
  {
    chapter: 4,
    title: "穷人为什么穷？",
    paragraphs: [
      "好，接下来我讲一个让我特别震撼的章节，叫时间的构成。",
      "为什么穷人穷？这个问题可能很多人想过。有人说是他们懒，有人说是他们不努力，有人说是他们运气不好。但是周洛华给了你一个完全不同的答案。",

      "研究者发现什么呢？同一批蔗农，在收获前六周做的智商测试成绩，比收获后六周低了整整百分之二十五。",

// ========== SPEECH ENGINE ==========
const synth = window.speechSynthesis;
let voices = [];
let selectedVoice = null;
let currentSegmentIndex = 0;
let currentParaIndex = 0;
let isPlaying = false;
let isPaused = false;
let playbackSpeed = 1.0;
let elapsedSeconds = 0;
let timerInterval = null;
let segmentStartTimes = [];

// Flatten all segments+paragraphs into a linear index
function getAllSpeechItems() {
  const items = [];
  PODCAST_DATA.forEach((seg, si) => {
    seg.paragraphs.forEach((p, pi) => {
      items.push({ segIndex: si, paraIndex: pi, text: p, chapter: seg.chapter, title: seg.title });
    });
  });
  return items;
}

const allItems = getAllSpeechItems();
const totalItems = allItems.length;

// Calculate estimated total time (chars / 220 chars per min for TTS at 1x)
const totalChars = allItems.reduce((sum, item) => sum + item.text.length, 0);
const estimatedMinutes = Math.round(totalChars / 220);

// Init voices
function initVoices() {
  voices = synth.getVoices();
  if (voices.length === 0) return;
  
  const select = document.getElementById('voiceSelect');
  select.innerHTML = '';
  
  // Prefer zh-CN male voices
  const zhVoices = voices.filter(v => v.lang.startsWith('zh'));
  const zhMale = zhVoices.filter(v => /male/i.test(v.name) || /yunjian|yunxi|yunyang|yunxia|wanlung|yunjhe/i.test(v.name));
  const zhFemale = zhVoices.filter(v => !/male/i.test(v.name) && !/yunjian|yunxi|yunyang|yunxia|wanlung|yunjhe/i.test(v.name));
  
  const sorted = [...zhMale, ...zhFemale, ...zhVoices.filter(v => !zhVoices.includes(v))];
  
  sorted.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = `${v.name.replace('Microsoft ','').replace(' Online (Natural)','')} (${v.lang})`;
    select.appendChild(opt);
  });
  
  // Auto-select first zh-CN male
  if (zhMale.length > 0) {
    selectedVoice = zhMale[0];
    select.value = zhMale[0].name;
  } else if (zhVoices.length > 0) {
    selectedVoice = zhVoices[0];
    select.value = zhVoices[0].name;
  }
}

if (synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = initVoices;
}
initVoices();

// Build chapter nav
function buildChapterNav() {
  const nav = document.getElementById('chapterNav');
  PODCAST_DATA.forEach((seg, i) => {
    const btn = document.createElement('button');
    btn.className = 'chapter-btn';
    btn.textContent = seg.title;
    btn.dataset.segIndex = i;
    btn.onclick = () => jumpToChapter(i);
    nav.appendChild(btn);
  });
}

// Build text cards
function buildTextCards() {
  const container = document.getElementById('textContainer');
  container.innerHTML = '';
  
  PODCAST_DATA.forEach((seg, si) => {
    // Chapter header
    const header = document.createElement('div');
    header.style.cssText = 'padding:8px 4px; margin-top:8px;';
    header.innerHTML = `<span style="font-size:12px; color:var(--primary); font-weight:600; letter-spacing:0.04em;">第${seg.chapter}章</span> <span style="font-size:14px; color:var(--text-muted); margin-left:8px;">${seg.title}</span>`;
    container.appendChild(header);
    
    seg.paragraphs.forEach((p, pi) => {
      const card = document.createElement('div');
      card.className = 'speech-card';
      card.id = `card-${si}-${pi}`;
      card.dataset.segIndex = si;
      card.dataset.paraIndex = pi;
      
      const isQuote = p.startsWith('【') && p.endsWith('】');
      const cleanText = isQuote ? p.slice(1, -1) : p;
      
      const para = document.createElement('p');
      para.textContent = cleanText;
      if (isQuote) para.classList.add('quote-line');
      card.appendChild(para);
      
      card.onclick = () => jumpToSegment(si, pi);
      container.appendChild(card);
    });
  });
}

// Highlight active card
function setActiveCard(segIdx, paraIdx) {
  document.querySelectorAll('.speech-card').forEach(c => {
    c.classList.remove('active', 'is-speaking');
    const si = parseInt(c.dataset.segIndex);
    const pi = parseInt(c.dataset.paraIndex);
    if (si < segIdx || (si === segIdx && pi < paraIdx)) {
      c.classList.add('played');
    } else {
      c.classList.remove('played');
    }
  });
  
  const card = document.getElementById(`card-${segIdx}-${paraIdx}`);
  if (card) {
    card.classList.add('active');
    if (isPlaying && !isPaused) card.classList.add('is-speaking');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  
  // Update chapter nav
  document.querySelectorAll('.chapter-btn').forEach((btn, i) => {
    btn.classList.toggle('active', parseInt(btn.dataset.segIndex) === segIdx);
  });
}

// Speak one paragraph
function speakParagraph(text, onEnd) {
  if (!synth) return;
  
  synth.cancel();
  
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-CN';
  utter.rate = playbackSpeed;
  utter.pitch = 0.9; // Slightly lower for gravitas
  utter.volume = 1;
  
  if (selectedVoice) {
    utter.voice = selectedVoice;
  }
  
  utter.onend = () => {
    if (onEnd) onEnd();
  };
  
  utter.onerror = (e) => {
    console.error('Speech error:', e);
    if (onEnd) onEnd();
  };
  
  synth.speak(utter);
}

// Timer
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (isPlaying && !isPaused) {
      elapsedSeconds++;
      updateTimerDisplay();
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
}

function updateTimerDisplay() {
  const mins = Math.floor(elapsedSeconds / 60);
  const secs = elapsedSeconds % 60;
  document.getElementById('elapsedTime').textContent = 
    `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}

function updateProgress() {
  const progress = ((currentSegmentIndex * 100 + currentParaIndex * 100 / (PODCAST_DATA[currentSegmentIndex]?.paragraphs.length || 1)) / totalItems) * 100;
  document.getElementById('progressFill').style.width = `${Math.min(progress, 100)}%`;
  document.getElementById('currentSegmentInfo').textContent = 
    `${currentSegmentIndex * 1 + 1} / ${PODCAST_DATA.length}`;
}

// Play sequence
function playSequence() {
  if (currentSegmentIndex >= PODCAST_DATA.length) {
    stopPlay();
    return;
  }
  
  const seg = PODCAST_DATA[currentSegmentIndex];
  if (currentParaIndex >= seg.paragraphs.length) {
    currentSegmentIndex++;
    currentParaIndex = 0;
    if (currentSegmentIndex >= PODCAST_DATA.length) {
      stopPlay();
      return;
    }
    // Brief pause between chapters
    setTimeout(() => playSequence(), 800);
    return;
  }
  
  const text = seg.paragraphs[currentParaIndex];
  const isQuote = text.startsWith('【') && text.endsWith('】');
  const cleanText = isQuote ? text.slice(1, -1) : text;
  
  setActiveCard(currentSegmentIndex, currentParaIndex);
  updateProgress();
  
  speakParagraph(cleanText, () => {
    if (isPlaying && !isPaused) {
      currentParaIndex++;
      // Brief pause between paragraphs
      setTimeout(() => playSequence(), 400);
    }
  });
}

// Controls
function togglePlay() {
  if (isPlaying && !isPaused) {
    // Pause
    synth.pause();
    isPaused = true;
    document.getElementById('playBtn').textContent = '▶';
    document.getElementById('statusDot').className = 'status-dot paused';
    document.getElementById('statusText').textContent = '已暂停';
    document.querySelectorAll('.speech-card.is-speaking').forEach(c => c.classList.remove('is-speaking'));
  } else if (isPaused) {
    // Resume
    synth.resume();
    isPaused = false;
    document.getElementById('playBtn').textContent = '⏸';
    document.getElementById('statusDot').className = 'status-dot speaking';
    document.getElementById('statusText').textContent = '正在播讲...';
    const card = document.getElementById(`card-${currentSegmentIndex}-${currentParaIndex}`);
    if (card) card.classList.add('is-speaking');
  } else {
    // Start fresh or continue
    isPlaying = true;
    isPaused = false;
    document.getElementById('playBtn').textContent = '⏸';
    document.getElementById('statusDot').className = 'status-dot speaking';
    document.getElementById('statusText').textContent = '正在播讲...';
    startTimer();
    playSequence();
  }
}

function stopPlay() {
  synth.cancel();
  isPlaying = false;
  isPaused = false;
  stopTimer();
  document.getElementById('playBtn').textContent = '▶';
  document.getElementById('statusDot').className = 'status-dot';
  document.getElementById('statusText').textContent = '已停止';
  document.querySelectorAll('.speech-card.is-speaking').forEach(c => c.classList.remove('is-speaking'));
}

function prevSegment() {
  if (currentParaIndex > 0) {
    currentParaIndex--;
  } else if (currentSegmentIndex > 0) {
    currentSegmentIndex--;
    currentParaIndex = 0;
  }
  if (isPlaying) {
    synth.cancel();
    setTimeout(() => playSequence(), 200);
  } else {
    setActiveCard(currentSegmentIndex, currentParaIndex);
    updateProgress();
  }
}

function nextSegment() {
  const seg = PODCAST_DATA[currentSegmentIndex];
  if (currentParaIndex < seg.paragraphs.length - 1) {
    currentParaIndex++;
  } else if (currentSegmentIndex < PODCAST_DATA.length - 1) {
    currentSegmentIndex++;
    currentParaIndex = 0;
  }
  if (isPlaying) {
    synth.cancel();
    setTimeout(() => playSequence(), 200);
  } else {
    setActiveCard(currentSegmentIndex, currentParaIndex);
    updateProgress();
  }
}

function jumpToChapter(segIdx) {
  currentSegmentIndex = segIdx;
  currentParaIndex = 0;
  if (!isPlaying) {
    setActiveCard(segIdx, 0);
    updateProgress();
  } else {
    synth.cancel();
    setTimeout(() => playSequence(), 200);
  }
}

function jumpToSegment(segIdx, paraIdx) {
  currentSegmentIndex = segIdx;
  currentParaIndex = paraIdx;
  if (!isPlaying) {
    setActiveCard(segIdx, paraIdx);
    updateProgress();
  } else {
    synth.cancel();
    setTimeout(() => playSequence(), 200);
  }
}

function seekToProgress(event) {
  const track = document.getElementById('progressTrack');
  const rect = track.getBoundingClientRect();
  const ratio = (event.clientX - rect.left) / rect.width;
  const targetItem = Math.floor(ratio * totalItems);
  
  // Find the segment and paragraph for this item
  let count = 0;
  for (let si = 0; si < PODCAST_DATA.length; si++) {
    for (let pi = 0; pi < PODCAST_DATA[si].paragraphs.length; pi++) {
      if (count === targetItem) {
        jumpToSegment(si, pi);
        return;
      }
      count++;
    }
  }
}

function setSpeed(speed) {
  playbackSpeed = speed;
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.classList.toggle('active', parseFloat(btn.dataset.speed) === speed);
  });
  // Update synth if currently speaking
  if (synth.speaking) {
    synth.cancel();
    setTimeout(() => playSequence(), 200);
  }
}

function changeVoice() {
  const voiceName = document.getElementById('voiceSelect').value;
  selectedVoice = voices.find(v => v.name === voiceName) || null;
  if (synth.speaking) {
    synth.cancel();
    setTimeout(() => playSequence(), 200);
  }
}

// Check browser support
function checkSupport() {
  if (!('speechSynthesis' in window)) {
    document.getElementById('warningBanner').style.display = 'block';
    document.getElementById('playBtn').disabled = true;
    document.getElementById('playBtn').style.opacity = '0.3';
    return false;
  }
  return true;
}

// Init
function init() {
  const supported = checkSupport();
  buildChapterNav();
  buildTextCards();
  setActiveCard(0, 0);
  updateProgress();
  
  document.getElementById('estimatedTotal').textContent = 
    `~${estimatedMinutes}:00`;
  document.getElementById('totalDuration').textContent = 
    `⏱ 约${estimatedMinutes}分钟`;
  
  // Hide loading
  setTimeout(() => {
    document.getElementById('loadingOverlay').classList.add('hidden');
    setTimeout(() => {
      document.getElementById('loadingOverlay').style.display = 'none';
    }, 500);
  }, 600);
}

// Prevent Chrome from stopping speech after ~15s
// Chrome bug: long utterances get cut off. We use short paragraphs so this should be fine,
// but add a keepalive just in case.
if (synth) {
  setInterval(() => {
    if (synth.speaking && !synth.paused) {
      synth.pause();
      synth.resume();
    }
  }, 10000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
